stages:
  - build
  - deploy

variables:
  # Docker configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # GitLab Container Registry (self-hosted at https://gitlab.aghatis.id/)
  # CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD are automatically set by GitLab
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  # Alternative: Use custom registry URL if needed
  # CI_REGISTRY: "registry.gitlab.aghatis.id"

# Build Docker image
build:docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "Logging in to GitLab Container Registry at $CI_REGISTRY..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build -t $IMAGE_TAG -t $IMAGE_TAG_LATEST .
    - echo "Pushing Docker image to registry..."
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
  only:
    - main
    - master
    - develop
    - merge_requests
  tags:
    - docker

# Build Docker image for tags/releases
build:docker:release:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  before_script:
    - echo "Logging in to GitLab Container Registry at $CI_REGISTRY..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image for release $CI_COMMIT_TAG..."
    - docker build -t $IMAGE_TAG -t $IMAGE_TAG_LATEST .
    - echo "Pushing Docker image to registry..."
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
  only:
    - tags
  tags:
    - docker

